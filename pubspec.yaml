name: mana_line
description: MANA LINE — Digital operating system for local lending businesses
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1
  flutter_secure_storage: ^9.2.2
  # NOTE: pin this to whatever is actually current on pub.dev at merge time —
  # I could not verify an exact patch version live from this session (no
  # pub.dev network access here); 2.x is confirmed current major per
  # supabase.com/docs as of this session. Master chat: run
  # `flutter pub add supabase_flutter` locally to resolve the exact latest
  # version rather than trusting this pin verbatim.
  supabase_flutter: ^2.8.0
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  file_selector: ^1.1.0
  image: ^4.3.0
  geolocator: ^14.0.2
  # Reverse-geocoding for the address forms' "use my location" button. Uses
  # the platform's own geocoder — no API key, no Google Maps billing, and it
  # keeps working on the cheap handsets this app targets.
  geocoding: ^4.0.0
  local_auth: ^3.0.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  archive: ^3.6.1
  xml: ^6.6.1

  # Offline sync layer (see mana_line_offline_sync package delivered earlier)
  # mana_line_offline_sync:
  #   path: ../mana_line_offline_sync

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  # logo.png is a circle cropped to its own edge with a transparent surround.
  # Android keeps the alpha, so the icon reads as a disc rather than a square.
  # The App Store rejects any alpha channel, so iOS gets it flattened onto a
  # solid colour instead.
  #
  # White, not the navy this used to be. That navy existed to stop a white
  # halo forming around the old mark's gold rim; the current mark's rim is
  # blue and its inner ring is already white, so navy would now read as a dark
  # square with a blue coin floating on it.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    # The Terms & Privacy PDF ships inside the app rather than being fetched.
    # These are field users on 2G in villages, and the one document a person is
    # entitled to read before agreeing to it must not depend on a signal.
    # Updating the terms therefore means a new build — which is the right
    # trade here, and legal_documents records which version shipped.
    - assets/legal/
    - assets/fonts/
  # Manrope and Inter ship INSIDE the app. They used to be fetched at runtime
  # by google_fonts, which meant first paint depended on a network request in
  # exactly the low-connectivity conditions this app is built for: a village
  # user on 2G got system fallback fonts, and every number rendered without
  # the tabular figures money columns are aligned by.
  #
  # Variable files, one per family, rather than seven static cuts: Flutter maps
  # FontWeight onto the wght axis, and 1.0 MB total is less than the static set
  # would be. Inter also carries an opsz axis, left at its default.
  #
  # OFL 1.1 (licence text alongside the files) - redistribution inside an
  # application is permitted; the licence must travel with them, which is why
  # OFL-*.txt sits in the same folder and is bundled too.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
