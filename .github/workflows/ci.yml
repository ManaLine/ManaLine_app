name: CI

# Every guard in this repo -- the consumer census, the enum-literal scan, the
# invented-function-name scan, the layout sweeps at four text scales in two
# languages, the raw-key sweep over 1,336 keys -- used to depend on somebody
# remembering to type `flutter test` before pushing. This is that memory.

on:
  push:
    branches: [main, web-on-the-web]
  pull_request:

# A second push while the first is still running makes the first one's answer
# worthless. Cancel it rather than paying for a verdict on superseded code --
# except on main, where every commit's result is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # PINNED, not `channel: stable`. A floating channel means a green
          # build can turn red with no commit behind it, and the failure
          # arrives attributed to whoever pushed next. 3.44.6 is what this
          # project is developed against; test/ci_workflow_test.dart fails if
          # the two ever disagree.
          flutter-version: '3.44.6'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # NO CREDENTIALS, deliberately. The suite passes offline by design:
      # nothing under test/ reads SUPABASE_URL, and sql_tests_wired_test
      # prints a skip rather than failing when MANA_DB_URL is absent. Proved
      # on a clean Linux checkout on the first run: 2,448 tests, 5m 42s, green.
      # If a secret ever becomes necessary here, a test has started reaching
      # the network, and that is the thing to fix.
      - run: flutter test

  preflight:
    name: can this run build an apk
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      # WHY A WHOLE JOB FOR ONE `if`. Secrets are not readable from a
      # job-level `if:` condition, so the question "are the credentials set"
      # has to be answered inside a step and handed on as an output.
      #
      # Read through `env:` rather than interpolated straight into the script.
      # A secret spliced into a shell line is a shell injection waiting for a
      # value with a quote in it, and this runs on every push.
      - id: check
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### APK build skipped"
              echo ""
              echo "\`SUPABASE_URL\` and \`SUPABASE_ANON_KEY\` are not set as"
              echo "repository secrets, so there is nothing to build an"
              echo "installable APK from."
              echo ""
              echo "The guards still ran. Only the APK step was skipped."
              echo ""
              echo "Add them under **Settings -> Secrets and variables ->"
              echo "Actions**; the values are the two lines in the tracked"
              echo "\`run.ps1.txt\`. Both ship inside every APK anyway, which"
              echo "is why that file is tracked rather than ignored."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: assemble the apk
    runs-on: ubuntu-latest
    # Only if the guards passed. Assembling an APK from code that fails its
    # own tests spends four minutes producing something nobody should install.
    #
    # And only if there is anything to build WITH. Without the defines the
    # build still SUCCEEDS and produces an APK that hangs on a host that does
    # not exist -- the failure this project has already hit once, which is why
    # main.dart carries a "Build not configured" screen. Failing the whole run
    # for that would leave a red X on every push until somebody with repository
    # access is at a keyboard, and a CI that is always red is one nobody reads.
    # It skips, says so in the run summary, and starts working by itself the
    # moment the secrets exist.
    needs: [test, preflight]
    if: needs.preflight.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - run: flutter pub get

      # Belt and braces: the gate above should mean this never fires, but a
      # secret that exists and is EMPTY would pass the gate and produce the
      # silent-hang APK. Cheap to check, and the failure names itself.
      - name: check the build is configured
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" || { echo "SUPABASE_URL secret is empty"; exit 1; }
          test -n "$KEY" || { echo "SUPABASE_ANON_KEY secret is empty"; exit 1; }

      # RETRIED ONCE, and only this step.
      #
      # On 2026-09-15 this failed on web-on-the-web while the SAME COMMIT
      # passed on main four minutes later. The cause was not the code:
      #
      #   Could not resolve org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20
      #   Could not parse POM https://plugins.gradle.org/m2/.../*.pom
      #
      # Gradle could not reach the plugin registry. A red tick that means "the
      # registry was briefly unreachable" trains everybody to ignore red ticks,
      # which is worse than the flake.
      #
      # ONE retry, not three, and no retry anywhere else. A compile error fails
      # twice in about the same time it used to fail once; a registry blip
      # passes on the second attempt. If this step starts needing its retry
      # regularly, that is a signal worth seeing rather than absorbing -- so
      # the log says which attempt succeeded.
      - name: build the debug apk
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          build_apk() {
            flutter build apk --debug               --dart-define=SUPABASE_URL="$URL"               --dart-define=SUPABASE_ANON_KEY="$KEY"
          }
          if build_apk; then
            echo "apk built on the first attempt"
          else
            echo "::warning::first attempt failed; retrying once in case the plugin registry was unreachable"
            sleep 15
            build_apk
            echo "apk built on the SECOND attempt -- if this recurs, the flake is becoming a fault"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
