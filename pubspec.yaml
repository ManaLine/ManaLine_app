name: mana_line
description: MANA LINE — Digital operating system for local lending businesses
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1
  flutter_secure_storage: ^9.2.2
  # NOTE: pin this to whatever is actually current on pub.dev at merge time —
  # I could not verify an exact patch version live from this session (no
  # pub.dev network access here); 2.x is confirmed current major per
  # supabase.com/docs as of this session. Master chat: run
  # `flutter pub add supabase_flutter` locally to resolve the exact latest
  # version rather than trusting this pin verbatim.
  supabase_flutter: ^2.8.0
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  file_selector: ^1.1.0
  image: ^4.3.0
  geolocator: ^14.0.2

  # Offline sync layer (see mana_line_offline_sync package delivered earlier)
  # mana_line_offline_sync:
  #   path: ../mana_line_offline_sync

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  # fonts pulled via google_fonts at runtime — no bundled font files needed
  # unless you want fully offline-safe first paint (recommended for V1
  # given the target network conditions — see design/tokens/typography.dart
  # note on pre-bundling).
